<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ByteLab</title>
<style>
:root{
  --bg:#0F0E18; --card:#1A1926; --card2:#242331; --line:#2F2E3D;
  --teal:#6B5CF0; --teal-d:#3A2FB0; --gold:#FF8466; --gold-d:#E4572E;
  --text:#E7E4F2; --mute:#B3B0C6; --danger:#FF7A8F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,system-ui,sans-serif}
body{padding-bottom:150px}
header{display:flex;align-items:center;gap:14px;padding:18px 18px 8px}
header img{width:54px;height:54px;object-fit:contain}
header h1{margin:0;font-size:24px;letter-spacing:.3px}
header h1 span{color:var(--gold)}
header p{margin:2px 0 0;color:var(--mute);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 18px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mute);font-size:14px}
.chip.on{background:linear-gradient(135deg,var(--teal-d),var(--teal));color:#fff;border-color:transparent}
.banner{margin:10px 18px;padding:12px 14px;border-radius:14px;background:#35150C;border:1px solid var(--gold-d);color:#FFD0C4;font-size:13px;display:none}
.list{padding:8px 14px;display:grid;gap:12px}
.card{display:flex;align-items:center;gap:14px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;transition:.15s}
.card.sel{border-color:var(--gold);background:var(--card2)}
.ico{width:56px;height:56px;border-radius:16px;background:var(--card2);flex:0 0 56px;display:grid;place-items:center;overflow:hidden;font-weight:700;color:var(--gold);font-size:20px}
.ico img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.name{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{margin-top:3px;font-size:12.5px;color:var(--mute)}
.bar{height:6px;border-radius:6px;background:var(--line);margin-top:8px;overflow:hidden;display:none}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-d))}
.btn{border:0;border-radius:14px;padding:10px 16px;font-size:14px;font-weight:600;color:#2A0A02;background:linear-gradient(135deg,var(--gold),var(--gold-d))}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold-d)}
.btn.dis{background:var(--line);color:var(--mute)}
.more{width:36px;height:36px;border-radius:12px;border:0;background:var(--card2);color:var(--mute);font-size:20px}
.empty{padding:40px 24px;text-align:center;color:var(--mute);font-size:14px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg) 28%);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dock .wide{grid-column:1/3}
.dock button{padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14.5px;font-weight:600}
.dock .primary{background:linear-gradient(135deg,var(--teal-d),var(--teal));border:0;color:#fff;font-size:16px}
.dock button:disabled{opacity:.4}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet div.box{width:100%;background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 10px;font-size:17px}
.sheet button{display:block;width:100%;text-align:left;padding:14px 10px;background:none;border:0;border-top:1px solid var(--line);color:var(--text);font-size:15px}
.sheet button.red{color:var(--danger)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="">
  <div><h1>Byte<span>Lab</span></h1><p>Pick a system and run it as a phone</p></div>
</header>
<div class="chips" id="chips"></div>
<div class="banner" id="banner"></div>
<div class="list" id="list"></div>
<div class="empty" id="empty"><span class="spin"></span>Loading systems…</div>

<div class="dock">
  <button class="primary wide" id="open" disabled>Open selected</button>
  <button id="custom">+ Add image</button>
  <button id="vms">VM list</button>
</div>

<div class="sheet" id="sheet" onclick="closeSheet()"><div class="box" onclick="event.stopPropagation()">
  <h3 id="sheetTitle"></h3>
  <button onclick="act('open')">Open</button>
  <button onclick="act('shortcut')">Add shortcut to home screen</button>
  <button class="red" onclick="act('delete')">Delete downloaded file</button>
</div></div>

<script>
var items=[], plat='all', sel=null, sheetId=null, progress={};
function $(i){return document.getElementById(i)}
function bridge(){return window.Android}

window.onCatalog=function(json,info){
  items=JSON.parse(json); info=info||{};
  var b=$('banner');
  if(info.notice){b.style.display='block';b.textContent=info.notice}else b.style.display='none';
  render();
};
window.onProgress=function(id,pct){
  progress[id]=pct;
  var bar=document.getElementById('bar-'+id), fill=document.getElementById('fill-'+id), btn=document.getElementById('btn-'+id);
  if(bar){bar.style.display='block';fill.style.width=pct+'%'}
  if(btn){btn.textContent=pct+'%'}
};
window.onProgressDone=function(id){delete progress[id]};

function platforms(){
  var s={};items.forEach(function(i){s[i.platform]=1});
  return ['all'].concat(Object.keys(s));
}
function label(p){return p==='all'?'All':p==='pc'?'PC':p==='ios'?'iOS':p.charAt(0).toUpperCase()+p.slice(1)}

function render(){
  var cur=items.filter(function(i){return i.id===sel})[0];
  if(!cur||!cur.downloaded){sel=null;$('open').disabled=true}
  var c=$('chips');c.innerHTML='';
  platforms().forEach(function(p){
    var d=document.createElement('div');d.className='chip'+(p===plat?' on':'');d.textContent=label(p);
    d.onclick=function(){plat=p;render()};c.appendChild(d);
  });
  var l=$('list');l.innerHTML='';
  var shown=items.filter(function(i){return plat==='all'||i.platform===plat});
  $('empty').style.display=shown.length?'none':'block';
  if(!shown.length)$('empty').textContent='Nothing here yet.';
  shown.forEach(function(i){
    var d=document.createElement('div');d.className='card'+(sel===i.id?' sel':'');
    var ic=i.iconUrl?'<img src="'+i.iconUrl+'" onerror="this.parentNode.textContent=\''+esc((i.name||'?').charAt(0))+'\'">':esc((i.name||'?').charAt(0));
    var meta=[i.arch,i.size].filter(Boolean).join('  •  ');
    var action;
    if(progress[i.id]!=null)action='<button class="btn ghost" id="btn-'+i.id+'">'+progress[i.id]+'%</button>';
    else if(i.downloaded)action='<button class="more" data-more="'+i.id+'">⋮</button>';
    else if(!i.available)action='<button class="btn dis">Soon</button>';
    else action='<button class="btn" data-dl="'+i.id+'">Download</button>';
    d.innerHTML='<div class="ico">'+ic+'</div><div class="info"><div class="name">'+esc(i.name)+'</div><div class="sub">'+esc(meta||i.platform)+(i.downloaded?'  •  Ready':'')+'</div><div class="bar" id="bar-'+i.id+'" style="'+(progress[i.id]!=null?'display:block':'')+'"><i id="fill-'+i.id+'" style="width:'+(progress[i.id]||0)+'%"></i></div></div>'+action;
    d.onclick=function(e){
      var t=e.target;
      if(t.dataset.dl){progress[i.id]=0;render();bridge().download(i.id);return}
      if(t.dataset.more){sheetId=i.id;$('sheetTitle').textContent=i.name;$('sheet').className='sheet on';return}
      if(i.downloaded){sel=i.id;$('open').disabled=false;render()}
      else if(i.available&&progress[i.id]==null){bridge().toast('Tap Download first')}
      else if(!i.available){bridge().toast('Not uploaded yet')}
    };
    l.appendChild(d);
  });
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function closeSheet(){$('sheet').className='sheet'}
function act(a){
  closeSheet();if(!sheetId)return;
  if(a==='open')bridge().launch(sheetId);
  if(a==='shortcut')bridge().shortcut(sheetId);
  if(a==='delete')bridge().remove(sheetId);
}
$('open').onclick=function(){if(sel)bridge().launch(sel)};
$('custom').onclick=function(){bridge().addCustom()};
$('vms').onclick=function(){bridge().openVmList()};
document.addEventListener('DOMContentLoaded',function(){
  if(window.Android)window.Android.ready();
  else{ // preview in a normal browser
    window.Android={ready:function(){onCatalog(JSON.stringify([{id:'a-9',platform:'android',name:'Android 9.0.0',arch:'arm64',size:'282MB',available:true,downloaded:false},{id:'a-11',platform:'android',name:'Android 11.0.0',arch:'arm64',size:'351MB',available:true,downloaded:true}]))},toast:function(t){alert(t)},download:function(){},launch:function(){},shortcut:function(){},remove:function(){},addCustom:function(){},openVmList:function(){}};
    window.Android.ready();
  }
});
</script>
</body>
</html>
