name: ByteLab APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # shell-loader reads ~/.android/debug.keystore while Gradle is configuring,
      # so it must exist before any Gradle command runs.
      - name: Create default debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storetype PKCS12 \
              -storepass android -alias AndroidDebugKey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages (with retry)
        run: |
          set -e
          for i in 1 2 3; do
            if sdkmanager --channel=3 \
              "platforms;android-37.0" \
              "build-tools;37.0.0" \
              "ndk;27.3.13750724" \
              "ndk;28.2.13676358"; then
              break
            fi
            echo "Android SDK package install failed, retry $i"
            sleep 10
          done
          test -d "$ANDROID_HOME/platforms/android-37.0"
          # Some Android Gradle Plugin versions look for android-37 while
          # the SDK repository publishes this platform as android-37.0.
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -d "$ANDROID_HOME/build-tools/37.0.0"

      # The release key comes from GitHub Actions Secrets. If the secret is not
      # set, the release build is skipped and only the debug APK is built.
      - name: Restore ByteLab signing key (if available)
        env:
          KEYSTORE_BASE64: ${{ secrets.BYTELAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key secret found - release build will be skipped."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/bytelab-signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bytelab-signing/bytelab-release.jks"
          test -s "$RUNNER_TEMP/bytelab-signing/bytelab-release.jks"
          echo "HAS_KEY=true" >> "$GITHUB_ENV"
          echo "BYTELAB_KEYSTORE_FILE=$RUNNER_TEMP/bytelab-signing/bytelab-release.jks" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          BYTELAB_STORE_PASSWORD: ${{ secrets.BYTELAB_STORE_PASSWORD }}
          BYTELAB_KEY_ALIAS: ${{ secrets.BYTELAB_KEY_ALIAS }}
          BYTELAB_KEY_PASSWORD: ${{ secrets.BYTELAB_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          VERSION_CODE=$((157 + GITHUB_RUN_NUMBER))
          ./gradlew --no-daemon assembleDebug -PVERSION_CODE="$VERSION_CODE"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ByteLab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build signed release APKs
        if: env.HAS_KEY == 'true'
        env:
          BYTELAB_STORE_PASSWORD: ${{ secrets.BYTELAB_STORE_PASSWORD }}
          BYTELAB_KEY_ALIAS: ${{ secrets.BYTELAB_KEY_ALIAS }}
          BYTELAB_KEY_PASSWORD: ${{ secrets.BYTELAB_KEY_PASSWORD }}
        run: |
          VERSION_CODE=$((157 + GITHUB_RUN_NUMBER))
          ./gradlew --no-daemon assembleRelease -PVERSION_CODE="$VERSION_CODE"

      - name: Upload signed release APKs
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ByteLab-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
