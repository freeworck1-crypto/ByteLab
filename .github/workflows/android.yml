name: ByteLab APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages (with retry)
        run: |
          for i in 1 2 3; do
            sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" && break
            echo "Install failed, retry $i"
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
            sleep 10
          done
          test -d "$ANDROID_HOME/ndk/28.2.13676358"

      # The release key is supplied through GitHub Actions Secrets.
      # Never generate a new signing key during a build.
      - name: Restore persistent ByteLab signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BYTELAB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing BYTELAB_KEYSTORE_BASE64. Configure the four ByteLab signing secrets before building."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/bytelab-signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bytelab-signing/bytelab-release.jks"
          test -s "$RUNNER_TEMP/bytelab-signing/bytelab-release.jks"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APKs
        env:
          BYTELAB_KEYSTORE_FILE: ${{ runner.temp }}/bytelab-signing/bytelab-release.jks
          BYTELAB_STORE_PASSWORD: ${{ secrets.BYTELAB_STORE_PASSWORD }}
          BYTELAB_KEY_ALIAS: ${{ secrets.BYTELAB_KEY_ALIAS }}
          BYTELAB_KEY_PASSWORD: ${{ secrets.BYTELAB_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          VERSION_CODE=$((157 + GITHUB_RUN_NUMBER))
          ./gradlew --no-daemon assembleRelease -PVERSION_CODE="$VERSION_CODE"

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: ByteLab-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
