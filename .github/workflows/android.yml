name: ByteLab APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages (with retry)
        run: |
          for i in 1 2 3; do
            sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" && break
            echo "Install failed, retry $i"
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
            sleep 10
          done
          test -d "$ANDROID_HOME/ndk/28.2.13676358"

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ByteLab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
